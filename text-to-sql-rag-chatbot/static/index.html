<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Text-to-SQL Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="authTitle">Sign In</h2>
            <p id="authSubtitle">Log in to access your persistent database queries</p>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username" required />
                <input type="password" id="authPassword" placeholder="Password" required />
                <button type="submit" id="authSubmitBtn">Sign In</button>
            </form>
            <p class="toggle-text">
                <span id="toggleMsg">Don't have an account?</span>
                <a href="#" id="authToggleLink">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Main Application Workspace -->
    <div class="app-layout" id="appLayout" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div>
                    <h3 id="userDisplay">User</h3>
                    <span class="badge">Long-Term Memory</span>
                </div>
                <button id="logoutBtn" title="Logout">Logout</button>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <h2>🗄️ MySQL Database AI Assistant</h2>
                <p>Short-term conversational context enabled</p>
            </header>

            <div class="messages-container" id="messagesContainer"></div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="userInput"
                    placeholder="Ask a question (e.g., What was the budget of Product 12?)" autocomplete="off"
                    required />
                <button type="submit" id="sendBtn">Send</button>
            </form>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
